  <div id="root"></div>

  <!-- React Application Logic -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==========================================================
    // REUSABLE SVG ICONS & LOGOS
    // ==========================================================

    const MuLearnLogo = ({ className = "w-8 h-8" }) => (
      <svg className={className} viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="100" rx="24" fill="#1A1A1A" />
        <path d="M28 32V68M44 48C44 60 52 68 64 68C76 68 76 52 76 32" stroke="#FF5722" strokeWidth="9" strokeLinecap="round" strokeLinejoin="round" />
        <circle cx="28" cy="24" r="5" fill="#00BFA5" />
        <circle cx="76" cy="24" r="5" fill="#00BFA5" />
        <circle cx="50" cy="80" r="4" fill="#FF5722" />
      </svg>
    );

    const KarmaCoinIcon = ({ className = "w-6 h-6", glow = false }) => (
      <svg className={`${className} ${glow ? 'filter drop-shadow-[0_0_8px_rgba(255,87,34,0.6)]' : ''}`} viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="22" fill="#FF5722" stroke="#E64A19" strokeWidth="2"/>
        <circle cx="24" cy="24" r="18" fill="#FF7043" stroke="#FFAB91" strokeWidth="1.5" strokeDasharray="3 3"/>
        <path d="M19 14L29 24L19 34M25 14L35 24L25 34" stroke="white" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" opacity="0.3"/>
        <text x="24" y="30" textAnchor="middle" fill="white" fontWeight="900" fontSize="18" fontFamily="Outfit, sans-serif">K</text>
      </svg>
    );

    const TrophyIcon = ({ className = "w-6 h-6" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
      </svg>
    );

    const FlameIcon = ({ className = "w-5 h-5 text-brand-orange" }) => (
      <svg className={className} fill="currentColor" viewBox="0 0 20 20">
        <path fillRule="evenodd" d="M12.395 2.553a1 1 0 00-1.45-.385c-.345.23-.614.558-.822.88-.527.82-1.11 2.05-1.41 3.528-.42-1.127-1.12-2.12-2.02-2.793a1 1 0 00-1.458.26C4.417 5.253 4 6.772 4 8.5 4 12.642 7.358 16 11.5 16s7.5-3.358 7.5-7.5c0-2.48-1.08-4.63-2.78-5.947h-.001a1 1 0 00-.824 0zM11.5 14c-2.485 0-4.5-2.015-4.5-4.5 0-.585.112-1.144.316-1.658.625 1.055 1.636 1.83 2.834 2.158.4.11.83.05 1.18-.16a1 1 0 00.47-.84c0-.528-.088-1.037-.25-1.516.48.514.86 1.14 1.1 1.836.27.785.4 1.63.4 2.68 0 1.105-.448 2-1.05 2z" clipRule="evenodd"/>
      </svg>
    );

    // ==========================================================
    // CONFIRMED REGISTRATION QR CODE COMPONENT
    // ==========================================================
    const QRCodeCard = ({ value, size = 120, label = "SCAN TO VERIFY PASS" }) => {
      const containerRef = useRef(null);
      const [qrReady, setQrReady] = useState(false);

      useEffect(() => {
        if (!containerRef.current) return;
        containerRef.current.innerHTML = "";
        try {
          if (window.QRCode) {
            new window.QRCode(containerRef.current, {
              text: value,
              width: size,
              height: size,
              colorDark: "#1A1A1A",
              colorLight: "#FFFFFF",
              correctLevel: window.QRCode.CorrectLevel ? window.QRCode.CorrectLevel.M : 0,
            });
            setQrReady(true);
          }
        } catch (e) {
          console.warn("QRCode rendering fallback", e);
        }
      }, [value, size]);

      return (
        <div className="flex flex-col items-center text-center">
          <div className="p-2 bg-white rounded-xl border border-gray-200 shadow-md inline-block relative group">
            {/* Native Client JS Canvas/Image if QRCode is active */}
            <div 
              ref={containerRef} 
              className={qrReady ? "flex items-center justify-center overflow-hidden rounded" : "hidden"}
              style={{ width: size, height: size }}
            />
            {/* Fallback Image (guaranteed to render immediately) */}
            {!qrReady && (
              <img
                src={`https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&margin=3&color=1A1A1A&bgcolor=FFFFFF&data=${encodeURIComponent(value)}`}
                alt="Registration Pass QR Code"
                className="w-full h-full object-contain rounded"
                width={size}
                height={size}
                loading="eager"
              />
            )}
          </div>
          {label && (
            <div className="flex items-center justify-center gap-1.5 mt-2">
              <span className="w-1.5 h-1.5 rounded-full bg-brand-teal animate-pulse"></span>
              <span className="text-[10px] font-black uppercase tracking-wider text-gray-300 font-display">
                {label}
              </span>
            </div>
          )}
        </div>
      );
    };

    // ==========================================================
    // MAIN APP COMPONENT
    // ==========================================================

    function App() {
      // Mobile menu state
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      // Countdown & Timer mode state (Supports auto real time + preview simulator)
      const [timerMode, setTimerMode] = useState('auto'); // 'auto' | 'pre' | 'live' | 'concluded'
      const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0, status: 'upcoming' });

      // FAQ Accordion State (open index)
      const [openFaq, setOpenFaq] = useState(0);

      // Interactive Karma Goal Simulator
      const [selectedSimTasks, setSelectedSimTasks] = useState([0, 1, 2]);

      // Registration Form State
      const [formData, setFormData] = useState({
        fullName: '',
        email: '',
        phone: '',
        college: '',
        branch: 'CSE',
        yearOfStudy: '1st Year (Exclusive Eligibility)',
        rollNumber: '',
        mulearnId: '',
        interestArea: 'Programming',
        usedMulearnBefore: 'No',
        referralSource: 'College',
        message: '',
        consent: false,
      });

      // Form validation errors
      const [errors, setErrors] = useState({});
      const [isSubmitting, setIsSubmitting] = useState(false);

      // Success modal state & ticket data
      const [showSuccessModal, setShowSuccessModal] = useState(false);
      const [registrationTicket, setRegistrationTicket] = useState(null);
      const [savedTicket, setSavedTicket] = useState(null);
      const [copyNotification, setCopyNotification] = useState(false);
      const [registeredCount, setRegisteredCount] = useState(148);

      // Initialize registrations count & last confirmed pass from localStorage
      useEffect(() => {
        try {
          const stored = localStorage.getItem('karma_marathon_registrations');
          if (stored) {
            const parsed = JSON.parse(stored);
            if (Array.isArray(parsed) && parsed.length > 0) {
              setRegisteredCount(148 + parsed.length);
              setSavedTicket(parsed[parsed.length - 1]);
            }
          }
        } catch (e) {
          console.error("Local storage error", e);
        }
      }, []);

      // Timer calculation logic based on official event rules:
      // Start: 16 August 2026 00:00:00
      // End: 27 August 2026 23:59:59
      useEffect(() => {
        const updateTimer = () => {
          const now = new Date();
          const targetStart = new Date('2026-08-16T00:00:00');
          const targetEnd = new Date('2026-08-27T23:59:59');

          if (timerMode === 'pre') {
            // Simulated countdown (T-Minus: e.g. 14 days, 6 hours, 28 min, 45 sec)
            const simulatedDiff = (14 * 24 * 3600 + 6 * 3600 + 42 * 60 + (60 - now.getSeconds())) * 1000;
            const days = Math.floor(simulatedDiff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((simulatedDiff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((simulatedDiff / 1000 / 60) % 60);
            const seconds = Math.floor((simulatedDiff / 1000) % 60);
            setTimeLeft({ days, hours, minutes, seconds, status: 'upcoming' });
            return;
          }

          if (timerMode === 'live') {
            setTimeLeft({ days: 0, hours: 0, minutes: 0, seconds: 0, status: 'live' });
            return;
          }

          if (timerMode === 'concluded') {
            setTimeLeft({ days: 0, hours: 0, minutes: 0, seconds: 0, status: 'concluded' });
            return;
          }

          // AUTO MODE: Strictly evaluates against current real client time
          if (now < targetStart) {
            const diff = targetStart - now;
            const days = Math.max(0, Math.floor(diff / (1000 * 60 * 60 * 24)));
            const hours = Math.max(0, Math.floor((diff / (1000 * 60 * 60)) % 24));
            const minutes = Math.max(0, Math.floor((diff / 1000 / 60) % 60));
            const seconds = Math.max(0, Math.floor((diff / 1000) % 60));
            setTimeLeft({ days, hours, minutes, seconds, status: 'upcoming' });
          } else if (now >= targetStart && now <= targetEnd) {
            setTimeLeft({ days: 0, hours: 0, minutes: 0, seconds: 0, status: 'live' });
          } else {
            setTimeLeft({ days: 0, hours: 0, minutes: 0, seconds: 0, status: 'concluded' });
          }
        };

        updateTimer();
        const interval = setInterval(updateTimer, 1000);
        return () => clearInterval(interval);
      }, [timerMode]);

      // Form input handler
      const handleInputChange = (e) => {
        const { name, value, type, checked } = e.target;
        setFormData(prev => ({
          ...prev,
          [name]: type === 'checkbox' ? checked : value
        }));
        // Clear field error on change
        if (errors[name]) {
          setErrors(prev => ({ ...prev, [name]: null }));
        }
      };

      // Validation logic
      const validateForm = () => {
        const newErrors = {};
        if (!formData.fullName.trim()) newErrors.fullName = 'Full Name is strictly required.';
        
        if (!formData.email.trim()) {
          newErrors.email = 'Email Address is required.';
        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.email.trim())) {
          newErrors.email = 'Please provide a valid email format (e.g. name@college.edu).';
        }

        if (!formData.phone.trim()) {
          newErrors.phone = 'Phone Number is required.';
        } else {
          const cleanPhone = formData.phone.replace(/[^0-9]/g, '');
          if (cleanPhone.length < 10) {
            newErrors.phone = 'Enter a valid 10-digit mobile number.';
          }
        }

        if (!formData.college.trim()) newErrors.college = 'College / Institution name is required.';
        if (!formData.rollNumber.trim()) newErrors.rollNumber = 'College Roll Number / Student ID is required.';
        if (!formData.mulearnId.trim()) newErrors.mulearnId = 'μLearn Username / ID is required.';
        if (!formData.consent) newErrors.consent = 'You must confirm that you are a 1st-year student and data is accurate.';

        setErrors(newErrors);
        return Object.keys(newErrors).length === 0;
      };

      // Form submission
      const handleSubmit = (e) => {
        e.preventDefault();
        if (!validateForm()) {
          // Scroll to first error
          const firstErrorField = document.querySelector('.border-red-500');
          if (firstErrorField) {
            firstErrorField.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
          return;
        }

        setIsSubmitting(true);

        setTimeout(() => {
          const randomIdSuffix = Math.floor(100000 + Math.random() * 900000);
          const regId = `KM26-${randomIdSuffix}`;

          const ticket = {
            id: regId,
            name: formData.fullName,
            email: formData.email,
            phone: formData.phone,
            college: formData.college,
            branch: formData.branch,
            rollNumber: formData.rollNumber,
            mulearnId: formData.mulearnId,
            interestArea: formData.interestArea,
            event: 'Karma Marathon (16 August – 27 August 2026)',
            timestamp: new Date().toISOString(),
          };

          // Save to localStorage
          try {
            const existing = JSON.parse(localStorage.getItem('karma_marathon_registrations') || '[]');
            existing.push(ticket);
            localStorage.setItem('karma_marathon_registrations', JSON.stringify(existing));
            setRegisteredCount(148 + existing.length);
          } catch (err) {
            console.error(err);
          }

          setRegistrationTicket(ticket);
          setSavedTicket(ticket);
          setIsSubmitting(false);
          setShowSuccessModal(true);

          // Confetti celebration
          if (window.confetti) {
            window.confetti({
              particleCount: 100,
              spread: 70,
              origin: { y: 0.6 },
              colors: ['#FF5722', '#00BFA5', '#FFD54F', '#1A1A1A']
            });
          }
        }, 600);
      };

      // Copy Reg ID helper
      const copyRegId = () => {
        if (!registrationTicket) return;
        navigator.clipboard.writeText(registrationTicket.id);
        setCopyNotification(true);
        setTimeout(() => setCopyNotification(false), 2500);
      };

      // Reset form for next participant
      const resetForm = () => {
        setFormData({
          fullName: '',
          email: '',
          phone: '',
          college: '',
          branch: 'CSE',
          yearOfStudy: '1st Year (Exclusive Eligibility)',
          rollNumber: '',
          mulearnId: '',
          interestArea: 'Programming',
          usedMulearnBefore: 'No',
          referralSource: 'College',
          message: '',
          consent: false,
        });
        setErrors({});
        setShowSuccessModal(false);
        setRegistrationTicket(null);
        const regSection = document.getElementById('register');
        if (regSection) regSection.scrollIntoView({ behavior: 'smooth' });
      };

      // Sample μJourney simulator task data
      const simTasks = [
        { id: 0, title: 'Intro to μLearn Ecosystem', karma: 200, category: 'Onboarding' },
        { id: 1, title: 'Setup Git & GitHub Profile', karma: 400, category: 'Tools' },
        { id: 2, title: 'Build Your First Web Page', karma: 600, category: 'Web' },
        { id: 3, title: 'Python Fundamentals Project', karma: 800, category: 'Programming' },
        { id: 4, title: 'Open Source Community Contribution', karma: 1000, category: 'Community' },
      ];

      const totalSimKarma = selectedSimTasks.reduce((acc, id) => {
        const task = simTasks.find(t => t.id === id);
        return acc + (task ? task.karma : 0);
      }, 0);

      const toggleSimTask = (id) => {
        if (selectedSimTasks.includes(id)) {
          setSelectedSimTasks(selectedSimTasks.filter(item => item !== id));
        } else {
          setSelectedSimTasks([...selectedSimTasks, id]);
        }
      };

      // Official FAQs strictly conforming to provided facts
      const faqs = [
        {
          q: 'What is Karma Marathon?',
          a: 'Karma Mining is a 12-day challenge for first-year students to explore μLearn and develop new skills through practical tasks from the μJourney section.'
        },
        {
          q: 'Who can participate?',
          a: '1st-year students only. This challenge is exclusively open to first-year students to jumpstart their tech learning.'
        },
        {
          q: 'When is the challenge?',
          a: 'The challenge runs from 16 August – 27 August 2026.'
        },
        {
          q: 'How long does the challenge run?',
          a: 'The challenge duration is 12 days.'
        },
        {
          q: 'How do I earn Karma?',
          a: 'Students complete tasks from the μJourney section based on their interests and earn Karma points based on task submissions.'
        },
        {
          q: 'What is μJourney?',
          a: 'μJourney is the learning pathway section on the μLearn platform where students explore practical tasks, develop new skills, and submit work to earn Karma.'
        },
        {
          q: 'What is the minimum Karma required to qualify?',
          a: 'A minimum of 3,000 Karma is required for students to qualify for Karma Marathon.'
        },
        {
          q: 'Will participants be divided into groups?',
          a: 'Yes! Students are divided into different groups. Each group has one dedicated volunteer to guide and support participants.'
        },
        {
          q: 'What does the volunteer do?',
          a: 'Volunteers help students with doubts, guide them through tasks, and support them throughout the 12-day challenge.'
        }
      ];

      return (
        <div className="min-h-screen flex flex-col font-sans bg-brand-cream text-brand-charcoal">
          
          {/* ========================================================== */}
          {/* STICKY NAVBAR */}
          {/* ========================================================== */}
          <nav className="sticky top-0 z-50 backdrop-blur-md bg-white/90 border-b border-gray-200/80 transition-all duration-300">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-20">
                
                {/* Left: μLearn PRC Branding */}
                <a href="#hero" className="flex items-center gap-3 group focus:outline-none">
                  <MuLearnLogo className="w-10 h-10 transition-transform duration-300 group-hover:scale-105" />
                  <div className="flex flex-col">
                    <div className="flex items-center gap-1.5">
                      <span className="font-display font-black text-xl tracking-tight text-brand-charcoal">
                        μLearn <span className="text-brand-orange">PRC</span>
                      </span>
                      <span className="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded bg-brand-teal/15 text-brand-teal-dark border border-brand-teal/30">
                        2026
                      </span>
                    </div>
                    <span className="text-xs font-semibold text-gray-500 tracking-wide">
                      KARMA MARATHON
                    </span>
                  </div>
                </a>

                    className="py-3 px-4 rounded-xl border border-gray-300 text-xs font-bold text-gray-700 hover:bg-gray-50 flex items-center justify-center gap-2 transition-colors shadow-sm"
                  >
                    <span>{copyNotification ? '✓ COPIED TO CLIPBOARD!' : '📋 COPY REGISTRATION ID'}</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => window.print()}
                    className="py-3 px-4 rounded-xl border-2 border-brand-teal/40 bg-teal-50/70 text-brand-teal-dark hover:bg-teal-100 text-xs font-black uppercase tracking-wider flex items-center justify-center gap-2 transition-all shadow-sm"
                  >
                    <span>🖨️ PRINT / SAVE PASS WITH QR</span>
                  </button>
                </div>

                {/* Action Buttons Row 2: Navigation & Multi-register */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <button
                    type="button"
                    onClick={() => {
                      setShowSuccessModal(false);
                      window.scrollTo({ top: 0, behavior: 'smooth' });
                    }}
                    className="w-full py-3.5 px-4 rounded-xl bg-brand-charcoal text-white text-xs sm:text-sm font-black font-display uppercase tracking-wider hover:bg-black transition-colors"
                  >
                    BACK TO HOME
                  </button>

                  <button
                    type="button"
                    onClick={resetForm}
                    className="w-full py-3.5 px-4 rounded-xl bg-brand-orange text-white text-xs sm:text-sm font-black font-display uppercase tracking-wider hover:bg-brand-orange-dark transition-colors shadow-orange-glow"
                  >
                    REGISTER ANOTHER PARTICIPANT
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    // Render the React application to the DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
